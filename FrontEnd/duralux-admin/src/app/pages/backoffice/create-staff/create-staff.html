<div class="page-header">
  <div class="page-header-left d-flex align-items-center">
    <div class="page-header-title">
      <h5 class="m-b-10">Create Staff Account</h5>
    </div>
    <ul class="breadcrumb">
      <li class="breadcrumb-item"><a routerLink="/backoffice/dashboard">Dashboard</a></li>
      <li class="breadcrumb-item">Create Staff Account</li>
    </ul>
  </div>
</div>

<div class="main-content">
  <div class="row justify-content-center">
    <div class="col-xxl-8 col-xl-10">
      <div class="card stretch stretch-full">
        <div class="card-header">
          <h5 class="card-title">New Staff Account</h5>
        </div>

        <div class="card-body">
          <div *ngIf="successMessage" class="alert alert-success">
            {{ successMessage }}
          </div>

          <div *ngIf="errorMessage" class="alert alert-danger">
            {{ errorMessage }}
          </div>

          <form (ngSubmit)="createStaff()" #staffFormRef="ngForm">
            <div class="row">
              <div class="col-md-6 mb-4">
                <label class="form-label fw-semibold">Username</label>
                <input
                  type="text"
                  class="form-control"
                  name="username"
                  [(ngModel)]="staffForm.username"
                  placeholder="Enter username"
                  required
                />
              </div>

              <div class="col-md-6 mb-4">
                <label class="form-label fw-semibold">CIN</label>
                <input
                  type="text"
                  class="form-control"
                  name="cin"
                  [(ngModel)]="staffForm.cin"
                  placeholder="Enter CIN"
                  required
                />
                <small class="text-muted">
                  Initial password is CIN. Account remains disabled until contract creation.
                </small>
              </div>

              <div class="col-md-6 mb-4">
                <label class="form-label fw-semibold">First Name</label>
                <input
                  type="text"
                  class="form-control"
                  name="firstName"
                  [(ngModel)]="staffForm.firstName"
                  placeholder="Enter first name"
                  required
                />
              </div>

              <div class="col-md-6 mb-4">
                <label class="form-label fw-semibold">Last Name</label>
                <input
                  type="text"
                  class="form-control"
                  name="lastName"
                  [(ngModel)]="staffForm.lastName"
                  placeholder="Enter last name"
                  required
                />
              </div>

              <div class="col-md-6 mb-4">
                <label class="form-label fw-semibold">Email</label>
                <input
                  type="email"
                  class="form-control"
                  name="email"
                  [(ngModel)]="staffForm.email"
                  placeholder="Enter email"
                  required
                />
              </div>

              <div class="col-md-6 mb-4">
                <label class="form-label fw-semibold">Phone</label>
                <input
                  type="text"
                  class="form-control"
                  name="phone"
                  [(ngModel)]="staffForm.phone"
                  placeholder="Enter phone number"
                  required
                />
              </div>

              <div class="col-md-6 mb-4">
                <label class="form-label fw-semibold">Date of Birth</label>
                <input
                  type="date"
                  class="form-control"
                  name="dateOfBirth"
                  [(ngModel)]="staffForm.dateOfBirth"
                  required
                />
              </div>

              <div class="col-md-3 mb-4">
                <label class="form-label fw-semibold">Sex</label>
                <select
                  class="form-control"
                  name="sex"
                  [(ngModel)]="staffForm.sex"
                  required
                >
                  <option value="" disabled>Select sex</option>
                  <option value="MALE">Male</option>
                  <option value="FEMALE">Female</option>
                </select>
              </div>

              <div class="col-md-3 mb-4">
                <label class="form-label fw-semibold">Role</label>
                <select
                  class="form-control"
                  name="role"
                  [(ngModel)]="staffForm.role"
                  required
                >
                  <option value="" disabled>Select role</option>
                  <option *ngFor="let role of roleOptions" [value]="role">
                    {{ role }}
                  </option>
                </select>
              </div>
            </div>

            <div class="d-flex gap-2 mt-3">
              <button
                type="submit"
                class="btn btn-primary"
                [disabled]="loading || staffFormRef.invalid"
              >
                {{ loading ? 'CREATING...' : 'CREATE STAFF ACCOUNT' }}
              </button>

              <a routerLink="/backoffice/dashboard" class="btn btn-light-brand">
                BACK TO DASHBOARD
              </a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
