<div class="page-header">
  <div class="page-header-left d-flex align-items-center">
    <div class="page-header-title">
      <h5 class="m-b-10">Create Guardian + Patient Profile</h5>
    </div>
    <ul class="breadcrumb">
      <li class="breadcrumb-item"><a routerLink="/backoffice/dashboard">Dashboard</a></li>
      <li class="breadcrumb-item">Create Guardian + Patient</li>
    </ul>
  </div>
</div>

<div class="main-content">
  <div class="row justify-content-center">
    <div class="col-xxl-9 col-xl-10">
      <div class="card stretch stretch-full">
        <div class="card-header">
          <h5 class="card-title">Patient Onboarding</h5>
        </div>

        <div class="card-body">
          <div *ngIf="successMessage" class="alert alert-success mb-3">
            {{ successMessage }}
          </div>
          <div *ngIf="errorMessage" class="alert alert-danger mb-3">
            {{ errorMessage }}
          </div>

          <form (ngSubmit)="submit()" #f="ngForm">
            <h6 class="section-title">Guardian Account Information</h6>
            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label fw-semibold">Guardian Username</label>
                <input
                  class="form-control"
                  name="guardianUsername"
                  [(ngModel)]="form.guardianUsername"
                  required
                />
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label fw-semibold">Guardian Email</label>
                <input
                  type="email"
                  class="form-control"
                  name="guardianEmail"
                  [(ngModel)]="form.guardianEmail"
                  required
                />
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label fw-semibold">Guardian CIN</label>
                <input
                  class="form-control"
                  name="guardianCin"
                  [(ngModel)]="form.guardianCin"
                  required
                />
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label fw-semibold">Guardian Phone</label>
                <input
                  class="form-control"
                  name="guardianPhone"
                  [(ngModel)]="form.guardianPhone"
                  required
                />
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label fw-semibold">Guardian First Name</label>
                <input
                  class="form-control"
                  name="guardianFirstName"
                  [(ngModel)]="form.guardianFirstName"
                  required
                />
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label fw-semibold">Guardian Last Name</label>
                <input
                  class="form-control"
                  name="guardianLastName"
                  [(ngModel)]="form.guardianLastName"
                  required
                />
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label fw-semibold">Guardian Date of Birth</label>
                <input
                  type="date"
                  class="form-control"
                  name="guardianDateOfBirth"
                  [(ngModel)]="form.guardianDateOfBirth"
                  required
                />
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label fw-semibold">Guardian Sex</label>
                <select
                  class="form-control"
                  name="guardianSex"
                  [(ngModel)]="form.guardianSex"
                  required
                >
                  <option value="" disabled>Select sex</option>
                  <option value="MALE">Male</option>
                  <option value="FEMALE">Female</option>
                </select>
              </div>
            </div>

            <h6 class="section-title mt-3">Patient Profile Information</h6>
            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label fw-semibold">Patient First Name</label>
                <input
                  class="form-control"
                  name="patientFirstName"
                  [(ngModel)]="form.patientFirstName"
                  required
                />
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label fw-semibold">Patient Last Name</label>
                <input
                  class="form-control"
                  name="patientLastName"
                  [(ngModel)]="form.patientLastName"
                  required
                />
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label fw-semibold">Patient Date of Birth</label>
                <input
                  type="date"
                  class="form-control"
                  name="patientDateOfBirth"
                  [(ngModel)]="form.patientDateOfBirth"
                  required
                />
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label fw-semibold">Patient Sex</label>
                <select
                  class="form-control"
                  name="patientSex"
                  [(ngModel)]="form.patientSex"
                  required
                >
                  <option value="" disabled>Select sex</option>
                  <option value="MALE">Male</option>
                  <option value="FEMALE">Female</option>
                </select>
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label fw-semibold">Blood Type (Optional)</label>
                <input
                  class="form-control"
                  name="patientBloodType"
                  [(ngModel)]="form.patientBloodType"
                  placeholder="e.g. A+, O-"
                />
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label fw-semibold">Allergies (Optional)</label>
                <input
                  class="form-control"
                  name="patientAllergies"
                  [(ngModel)]="form.patientAllergies"
                  placeholder="e.g. Penicillin, peanuts"
                />
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label fw-semibold">Chronic Conditions (Optional)</label>
                <input
                  class="form-control"
                  name="patientChronicConditions"
                  [(ngModel)]="form.patientChronicConditions"
                  placeholder="e.g. Asthma"
                />
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label fw-semibold">Medical Notes (Optional)</label>
                <input
                  class="form-control"
                  name="patientMedicalNotes"
                  [(ngModel)]="form.patientMedicalNotes"
                  placeholder="Initial notes from receptionist"
                />
              </div>
            </div>

            <div class="d-flex gap-2 mt-3">
              <button class="btn btn-primary" type="submit" [disabled]="loading || f.invalid">
                {{ loading ? 'CREATING...' : 'CREATE GUARDIAN + PATIENT' }}
              </button>
              <a routerLink="/backoffice/dashboard" class="btn btn-light-brand">BACK TO DASHBOARD</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
