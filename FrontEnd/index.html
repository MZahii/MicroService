<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NephrosPaidi - Gestion des utilisateurs</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800">
    <div class="container mx-auto p-4">
        <h1 class="text-3xl font-bold mb-6 text-center">NephrosPaidi - Gestion des utilisateurs</h1>

        <!-- Section Auth -->
        <div class="bg-white p-4 rounded shadow mb-6">
            <h2 class="text-xl font-semibold mb-3">1. Authentification</h2>
            <button onclick="login()" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Se connecter avec platform-admin</button>
            <div id="token-section" class="mt-3 hidden">
                <p class="text-sm text-green-600">✅ Connecté (token caché)</p>
            </div>
        </div>

        <!-- Section Créer utilisateur -->
        <div class="bg-white p-4 rounded shadow mb-6">
            <h2 class="text-xl font-semibold mb-3">2. Créer un utilisateur</h2>
            <form onsubmit="createUser(event)">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-3 mb-3">
                    <input type="text" id="username" placeholder="Nom d'utilisateur" required class="border p-2 rounded">
                    <input type="email" id="email" placeholder="Email" required class="border p-2 rounded">
                    <select id="role" class="border p-2 rounded">
                        <option value="ADMIN">ADMIN</option>
                        <option value="HR">HR</option>
                        <option value="RECEPTIONIST">RECEPTIONIST</option>
                        <option value="DOCTOR">DOCTOR</option>
                        <option value="NURSE">NURSE</option>
                        <option value="SURGEON">SURGEON</option>
                        <option value="PHARMACIST">PHARMACIST</option>
                        <option value="GUARDIAN">GUARDIAN</option>
                    </select>
                </div>
                <button type="submit" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700">Créer</button>
            </form>
            <div id="create-result" class="mt-3"></div>
        </div>

        <!-- Section Lister les utilisateurs -->
        <div class="bg-white p-4 rounded shadow mb-6">
            <h2 class="text-xl font-semibold mb-3">3. Liste des utilisateurs</h2>
            <button onclick="listUsers()" class="bg-purple-600 text-white px-4 py-2 rounded hover:bg-purple-700">Rafraîchir</button>
            <div id="users-list" class="mt-3"></div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8083';
        let token = null;

        async function login() {
            try {
                const response = await fetch('http://localhost:8080/realms/nephrospaidi/protocol/openid-connect/token', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: 'grant_type=password&client_id=nephros-app&username=platform-admin&password=platform-admin'
                });
                const data = await response.json();
                token = data.access_token;
                document.getElementById('token-section').classList.remove('hidden');
                alert('Connecté avec succès !');
            } catch (e) {
                alert('Erreur de connexion : ' + e.message);
            }
        }

        async function createUser(event) {
            event.preventDefault();
            if (!token) {
                alert('Veuillez vous connecter d\'abord');
                return;
            }
            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const role = document.getElementById('role').value;
            try {
                const response = await fetch(`${API_BASE}/users/internal`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ username, email, role })
                });
                const result = await response.json();
                document.getElementById('create-result').innerHTML = `<p class="text-green-600">✅ Utilisateur créé : ${result.username} (${result.role})</p>`;
                document.getElementById('username').value = '';
                document.getElementById('email').value = '';
                listUsers();
            } catch (e) {
                document.getElementById('create-result').innerHTML = `<p class="text-red-600">❌ Erreur : ${e.message}</p>`;
            }
        }

        async function listUsers() {
            if (!token) {
                alert('Veuillez vous connecter d\'abord');
                return;
            }
            try {
                const response = await fetch(`${API_BASE}/users`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const users = await response.json();
                const listHtml = users.map(u => `
                    <div class="border p-2 mb-2 rounded">
                        <strong>${u.username}</strong> (${u.email}) - <span class="bg-blue-100 px-2 py-1 rounded text-sm">${u.role}</span>
                    </div>
                `).join('');
                document.getElementById('users-list').innerHTML = listHtml || '<p>Aucun utilisateur trouvé</p>';
            } catch (e) {
                document.getElementById('users-list').innerHTML = `<p class="text-red-600">❌ Erreur : ${e.message}</p>`;
            }
        }
    </script>
</body>
</html>
