server:
  port: 8086

spring:
  application:
    name: core-ops-service
  config:
    import: optional:configserver:http://localhost:8888
  flyway:
    outOfOrder: true
    validateOnMigrate: false
    repairOnMigrate: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
