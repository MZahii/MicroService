spring:
  application:
    name: pharmacy-service
  config:
    import: optional:configserver:http://localhost:8888
  flyway:
    outOfOrder: true
    validateOnMigrate: false
    repairOnMigrate: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/nephrospaidi
          jwk-set-uri: http://localhost:8080/realms/nephrospaidi/protocol/openid-connect/certs

internal:
  api-key: my-super-secret-internal-key

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

# Resilience4j Circuit Breaker
resilience4j:
  circuitbreaker:
    configs:
      default:
        registerHealthIndicator: true
        slidingWindowSize: 10
        failureRateThreshold: 50
        slowCallRateThreshold: 50
        slowCallDurationThreshold: 2000
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 10000
    instances:
      default:
        baseConfig: default
  
  retry:
    configs:
      default:
        maxAttempts: 3
        waitDuration: 100
    instances:
      default:
        baseConfig: default

# Management/Actuator
management:
  endpoints:
    web:
      include: health,circuitbreakers
  endpoint:
    health:
      show-details: always
  health:
    circuitbreakers:
      enabled: true
