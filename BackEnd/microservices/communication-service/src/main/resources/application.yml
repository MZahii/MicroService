server:
  port: 8085

spring:
  application:
    name: communication-service
  datasource:
    url: jdbc:postgresql://${COMM_DB_HOST}:${COMM_DB_PORT}/${COMM_DB_NAME}?sslmode=require
    username: ${COMM_DB_USER}
    password: ${COMM_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/nephrospaidi}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka}

internal:
  api-key: ${INTERNAL_API_KEY:my-super-secret-internal-key}
  user-service:
    base-url: ${USER_SERVICE_BASE_URL:http://localhost:8090}
  administration-service:
    base-url: ${ADMINISTRATION_SERVICE_BASE_URL:http://localhost:8087}