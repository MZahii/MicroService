services:
  keycloak-db:
    image: postgres:16
    container_name: nephro-keycloak-db
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloakpass
    volumes:
      - keycloak_db:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: nephro-keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloakpass

      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin123

      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
    ports:
      - "8080:8080"
    depends_on:
      - keycloak-db
    volumes:
      - ./keycloak/realm:/opt/keycloak/data/import

  eureka:
    build:
      context: ./eureka
    container_name: nephro-eureka
    environment:
      EUREKA_DEFAULT_ZONE: http://eureka:8761/eureka/
    ports:
      - "8761:8761"

  api-gateway:
    build:
      context: ./api-gateway
    container_name: nephro-api-gateway
    environment:
      EUREKA_DEFAULT_ZONE: http://eureka:8761/eureka
      KEYCLOAK_ISSUER_URI: http://keycloak:8080/realms/nephrospaidi
    ports:
      - "8083:8083"
    depends_on:
      - eureka
      - keycloak

volumes:
  keycloak_db:
