server:
  port: 8083

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true
      routes:
        - id: ops-service
          uri: lb://ops-service
          predicates:
            - Path=/ops/**
          filters:
            - StripPrefix=1

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/nephrospaidi

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

