spring:
  application:
    name: api-gateway
  config:
    import: optional:configserver:http://localhost:8888
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/nephrospaidi
          jwk-set-uri: http://localhost:8080/realms/nephrospaidi/protocol/openid-connect/certs
