server:
  port: 8083

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOriginPatterns:
                  - "http://localhost:*"
                  - "http://127.0.0.1:*"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowedHeaders:
                  - "*"
                allowCredentials: true
          routes:
            - id: ops-service
              uri: lb://ops-service
              predicates:
                - Path=/ops/**
              filters:
                - StripPrefix=1

            - id: pharmacy-service-api
              uri: lb://pharmacy-service
              predicates:
                - Path=/pharmacy/**
              filters:
                - StripPrefix=1

            - id: communication-service-api
              uri: lb://communication-service
              predicates:
                - Path=/api/communication/**,/api/appointments/**

            - id: clinical-service-api
              uri: lb://clinical-service
              predicates:
                - Path=/clinical/**,/api/clinical/**

            - id: user-service-api
              uri: lb://user-service
              predicates:
                - Path=/api/auth/**,/api/users/**
              filters:
                - StripPrefix=1

            - id: administration-service-api
              uri: lb://administration-service
              predicates:
                - Path=/api/patients/**,/api/contracts/**,/api/observability/**
              filters:
                - StripPrefix=1

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/nephrospaidi}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka}
