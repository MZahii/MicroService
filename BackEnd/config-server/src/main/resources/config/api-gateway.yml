server:
  port: 8083

spring:
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: false
              lower-case-service-id: true
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOriginPatterns:
                  - "http://localhost:*"
                  - "http://127.0.0.1:*"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowedHeaders:
                  - "*"
                allowCredentials: true
          routes:
            # User Service - Authentication & User Management
            - id: user-service-api
              uri: lb://user-service
              predicates:
                - Path=/api/users/**,/api/auth/**
              filters:
                - StripPrefix=1

            # Administration Service - Patients, Contracts, Observability
            - id: administration-service-api
              uri: lb://administration-service
              predicates:
                - Path=/api/patients/**,/api/contracts/**,/api/observability/**
              filters:
                - StripPrefix=1

            # Clinical Service - Keep public paths aligned with service contracts
            - id: clinical-service-api
              uri: lb://clinical-service
              predicates:
                - Path=/clinical/**

            # Communication Service - Guardian/staff messaging and appointment requests
            - id: communication-service-api
              uri: lb://communication-service
              predicates:
                - Path=/api/communication/**,/api/appointments/**

            # Procedure Service - Explicit API namespace, no path rewriting
            - id: procedure-service-api
              uri: lb://procedure-service
              predicates:
                - Path=/api/procedures/**

            # Pharmacy Service - Preserve frontend namespace and rewrite once at the gateway edge
            - id: pharmacy-service-api
              uri: lb://pharmacy-service
              predicates:
                - Path=/pharmacy/api/**
              filters:
                - RewritePath=/pharmacy/api/?(?<segment>.*), /api/${segment}

            # Operations Service - Simple workshop ping endpoint
            - id: ops-service-api
              uri: lb://ops-service
              predicates:
                - Path=/ops/**
              filters:
                - RewritePath=/ops/?(?<segment>.*), /${segment}

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/nephrospaidi}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka}

management:
  endpoint:
    gateway:
      access: read-only
  endpoints:
    web:
      exposure:
        include: health,info,gateway
